    <style>
        body {

        }


        h1,
        h2 {

        }


        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;

        }


        button {
            background: #0066cc;
            color: white;

            border-radius: 5px;
            cursor: pointer;
        }


        button:hover {
            background: #004999;
        }


        .secondary {

        }

        }


        .success {

        .error {

        .table-container {

            border-collapse: separate;

            border-spacing: 8px;

        th,

            padding: 8px;

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-edit {

        .wpillus-calendar {
            margin-top: 20px;

            background: white;

        /* top bar */

        .wpillus-header {
            height: 60px;

            background: linear-gradient(135deg, #047857, #10B981);
            display: flex;

        .wpillus-header div {

        .wpillus-grid i {

    <script>


        // ===========================
        // GLOBAL VARIABLES
        // ===========================


        let password = "";

        let records = [];

        let editIndex = -1;



        // GitHub settings
        let GITHUB_USER = " ";
        let GITHUB_REPO = " ";
        let GITHUB_FILE = " ";
        let GITHUB_TOKEN = " ";

        let config = {};

        // ===========================
        // CALENDAR Front

        function loadCalendar() {

            let grid = document.getElementById("calendarGrid");
            monthYear = document.getElementById("currentMonthCalender");
            grid.innerHTML = "";


            let today = new Date();

            let year = today.getFullYear();
            let monthNumber = today.getMonth();


            monthYear.innerHTML = today.toLocaleString("default", { month: "long", year: "numeric" });

            monthYear.style.display = "flex";
            monthYear.style.alignItems = "center";
            monthYear.style.justifyContent = "center";

            monthYear.style.fontSize = "12px";
            monthYear.style.fontWeight = "500";

            monthYear.style.color = "#9ca3af";

            monthYear.style.overflow = "hidden";
            monthYear.style.whiteSpace = "nowrap";
            monthYear.style.textOverflow = "ellipsis";

            // First day of current month
            let firstDay = new Date(year, monthNumber, 1);


            // Convert Sunday=0 to Monday=0
            let mondayStart = (firstDay.getDay() + 6) % 7;


            // Start date of calendar (Monday)
            let startDate = new Date(year, monthNumber, 1);
            startDate.setDate(startDate.getDate() - mondayStart);


            let todayString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;


            // Create 35 blocks
            for (let i = 0; i < 35; i++) {

                let day = new Date(startDate);
                day.setDate(startDate.getDate() + i);


                let block = document.createElement("i");


                // Fade days not in current month
                if (day.getMonth() !== monthNumber) {
                    block.classList.add("fade");
                }

                let dayString = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
                // Highlight today
                if (dayString === todayString) {
                    block.classList.add("active");
                    block.style.display = "flex";
                    block.style.alignItems = "center";
                    block.style.justifyContent = "center";
                    block.style.color = "white";

                    block.textContent = day.getDate();
                }


                grid.appendChild(block);
            }
        }
        window.onload = function () {
            loadCalendar();
        };

        async function loadConfig() {

            try {

                const response = await fetch("config.json");

                if (!response.ok) {
                    throw new Error("Config file not found");
                }

                config = await response.json();


                console.log("Config loaded");


                // Use values
                GITHUB_USER = decrypt(config.githubUser);
                GITHUB_REPO = decrypt(config.githubRepo);
                GITHUB_FILE = decrypt(config.githubFile);
                GITHUB_TOKEN = decrypt(config.githubToken)?.replaceAll("##fad&&to", "") || "";


            }
            catch (error) {

                console.log(error);

                showMessage(
                    "❌ Cannot load config.json",
                    "error"
                );

            }

        }

        // ===========================
        // TIME FUNCTIONS
        // ===========================


        function toMinutes(time) {

            let p = time.split(":");

            return Number(p[0]) * 60 + Number(p[1]);

        }



        function formatMinutes(minutes) {

            let h = Math.floor(minutes / 60);

            let m = minutes % 60;

            return h + "h " + m + "m";

        }


        // ===========================
        // CALCULATE WORK HOURS
        // ===========================


        function calculateWork() {

            let start = document.getElementById("start").value;

            let finish = document.getElementById("finish").value;


            if (!start || !finish) {

                return null;

            }


            let total = toMinutes(finish) - toMinutes(start);


            if (total < 0) {

                total += 1440;

            }


            let breakMinutes = 0;

            let breakType = "No";


            let hasBreak = document.getElementById("hasBreak").value;



            if (hasBreak == "yes") {


                let bs = document.getElementById("breakStart").value;

                let be = document.getElementById("breakEnd").value;


                if (bs && be) {


                    breakMinutes =
                        toMinutes(be) - toMinutes(bs);



                    if (breakMinutes < 0) {

                        breakMinutes += 1440;

                    }


                    breakType = "Have";


                }



            }
            else if (total > 360) {


                breakMinutes = 30;

                breakType = "Auto";


            }



            return {

                total: total - breakMinutes,

                breakMinutes: breakMinutes,

                breakType: breakType

            };


        }





        // ===========================
        // SAVE RECORD
        // ===========================

        function saveRecord() {

            let date = document.getElementById("date").value;
            let start = document.getElementById("start").value;
            let finish = document.getElementById("finish").value;
            let hasBreakTime = document.getElementById("hasBreak").value;
            let startBreak = document.getElementById("breakStart").value;
            let endBreak = document.getElementById("breakEnd").value

            if (!date || !start || !finish || (hasBreakTime === "yes" && (!startBreak || !endBreak)) ) {
                showMessage(
                    "Date, start and finish times are required [required break times if it is 'YES']",
                    "error"
                );

                return;
            }


            let result = calculateWork();

            if (!result) {

                showMessage(
                    "Cannot calculate hours",
                    "error"
                );

                return;
            }

           if(hasBreakTime==="no") {
                startBreak = "";
                endBreak = "";
            }

            let record = {

                date: encrypt(date),

                start: encrypt(start),

                finish: encrypt(finish),

                breakStart: encrypt(startBreak),

                breakEnd: encrypt(endBreak),

                breakMinutes: encrypt(
                    result.breakMinutes
                ),

                breakType: encrypt(
                    result.breakType
                ),

                totalMinutes: encrypt(
                    result.total
                )

            };

            const duplicateDateRecord = records.some(r => decrypt(r.date) === date);

            if (duplicateDateRecord) {
                const proceed = window.confirm(
                    "Update Confirmation\n\n" +
                    "Date: " + date + "\n\n" +
                    "This date already has an entry.\n" +
                    "Do you want to replace it?"
                );

                if (!proceed) {
                    return;
                }
            }

            // Remove every record with the same date
            records = records.filter(r => decrypt(r.date) !== date);

            // Save the newest record
            records.push(record);

            if (editIndex >= 0) {
                showMessage("Updated successfully");
            } else {
                showMessage("Saved successfully");
            }


            // Reset edit mode
            editIndex = -1;

            const formInputs = [
                document.getElementById("date"),
                document.getElementById("start"),
                document.getElementById("finish"),
                document.getElementById("breakStart"),
                document.getElementById("breakEnd"),
                document.getElementById("hasBreak")
            ];

            formInputs.forEach(input => {
                if (input) {
                    input.disabled = false;
                    input.removeAttribute("readonly");
                    input.style.pointerEvents = "auto";
                    input.style.opacity = "1";
                }
            });

            clearForm();

            loadMonths();

            showMonth();

        }


        // ===========================
        // LOAD MONTH LIST
        // ===========================


        function loadMonths() {

            let select = document.getElementById("monthSelect");

            select.innerHTML = "";

            let months = [];


            records.forEach(r => {

                let date = decrypt(r.date);

                let month = date.substring(0, 7);


                if (!months.includes(month)) {
                    months.push(month);
                }

            });



            months.forEach(m => {


                let parts = m.split("-");

                let year = parts[0];

                let monthNumber = Number(parts[1]);


                let monthName = new Date(
                    year,
                    monthNumber - 1,
                    1
                ).toLocaleString(
                    "default",
                    {
                        month: "long"
                    }
                );


                let option = document.createElement("option");


                option.value = m;

                option.innerHTML =
                    monthName + " " + year;


                select.appendChild(option);


            });

            // Select current month if it exists
            let currentMonth = new Date().toISOString().slice(0, 7);

            if (months.includes(currentMonth)) {
                select.value = currentMonth;
            }

        }





        // ===========================
        // EDIT RECORD
        // ===========================


        function editRecord(index) {


            document.getElementById("app").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });


            let r = records[index];



            editIndex = index;




            const saveButton = document.getElementById("saveButton");
            const dateInput = document.getElementById("date");
            const startInput = document.getElementById("start");
            const finishInput = document.getElementById("finish");
            const breakStartInput = document.getElementById("breakStart");
            const breakEndInput = document.getElementById("breakEnd");
            const hasBreakSelect = document.getElementById("hasBreak");

            saveButton.innerHTML = "Update Record";

            [dateInput, startInput, finishInput, breakStartInput, breakEndInput, hasBreakSelect].forEach(input => {
                if (input) {
                    input.disabled = false;
                    input.removeAttribute("readonly");
                    input.style.pointerEvents = "auto";
                    input.style.opacity = "1";
                }
            });



            dateInput.value = decrypt(r.date);

            startInput.value = decrypt(r.start);

            finishInput.value = decrypt(r.finish);



            let bs = decrypt(r.breakStart);

            let be = decrypt(r.breakEnd);



            if (bs && be) {
                hasBreakSelect.value = "yes";
                toggleBreak();
                breakStartInput.value = bs;
                breakEndInput.value = be;

            }
            else {
                hasBreakSelect.value = "no";
                toggleBreak();


            }



            showMessage(
                "Editing selected record",
                "warning"
            );


        }


        function deleteRecord(index) {

            const record = records[index];

            if (!record) {
                showMessage("Record not found", "error");
                return;
            }

            const date = decrypt(record.date);

            const proceed = confirm(
                "Delete Confirmation\n\n" +
                "Date: " + date + "\n\n" +
                "Do you want to delete this record?"
            );

            if (!proceed) {
                return;
            }


            records.splice(index, 1);


            editIndex = -1;

            clearForm();

            loadMonths();

            showMonth();

            showMessage(
                "Deleted successfully",
                "success"
            );
        }

        // ===========================
        // SHOW MONTH REPORT
        // ===========================


        function showMonth() {


            let month = document.getElementById(
                "monthSelect"
            ).value;



            let body = document.getElementById(
                "reportBody"
            );

            records.sort((a, b) => {

                const dateA = new Date(decrypt(a.date));
                const dateB = new Date(decrypt(b.date));

                return dateA - dateB;

            });


            body.innerHTML = "";



            let totalHours = 0;

            let totalBreak = 0;

            let count = 0;

            const weekColors = [
                "#fef9c3", // light yellow
                "#dbeafe", // light blue
                "#dcfce7", // light green
                "#fae8ff", // light purple
                "#fee2e2", // light red
                "#f3f4f6"  // light gray
            ];

            let currentWeek = "";
            let weekIndex = -1;
            let weekTotal = 0;



            records.forEach((r, index) => {

                let date = decrypt(r.date);

                if (!date.startsWith(month)) return;

                count++;

                let start = decrypt(r.start);
                let finish = decrypt(r.finish);

                let bs = decrypt(r.breakStart);
                let be = decrypt(r.breakEnd);

                let breakMinutes = Number(decrypt(r.breakMinutes));
                let breakType = decrypt(r.breakType);
                let worked = Number(decrypt(r.totalMinutes));

                // Monday of current week
                let d = new Date(date);
                let day = d.getDay(); // Sunday=0
                let diff = (day === 0 ? -6 : 1 - day);

                let monday = new Date(d);
                monday.setDate(d.getDate() + diff);

                let weekKey = monday.toISOString().split("T")[0];

                // New week
                if (weekKey !== currentWeek) {

                    // Show previous week total
                    if (currentWeek !== "") {
                        let totalRow = body.insertRow();

                        totalRow.insertCell(0).colSpan = 9;
                        totalRow.cells[0].style.border = 'none';
                        totalRow.cells[0].style.textAlign = 'left';
                        totalRow.cells[0].style.textShadow = '0 1px 2px rgba(0, 0, 0, 0.1)';
                        totalRow.cells[0].style.fontWeight = 'bold';
                        totalRow.cells[0].innerHTML =
                            "Weekly Total Hours: " + formatMinutes(weekTotal);
                    }

                    currentWeek = weekKey;
                    weekIndex++;
                    weekTotal = 0;
                }

                weekTotal += worked;



                if (date.startsWith(month)) {



                    let start = decrypt(r.start);

                    let finish = decrypt(r.finish);


                    let bs = decrypt(r.breakStart);

                    let be = decrypt(r.breakEnd);



                    let breakMinutes = Number(
                        decrypt(r.breakMinutes)
                    );



                    let breakType = decrypt(
                        r.breakType
                    );



                    let worked = Number(
                        decrypt(r.totalMinutes)
                    );

                    mobileView(body, count, date, start, finish, bs, be, breakMinutes, breakType, worked, index, weekIndex, weekColors);


                    totalHours += worked;
                    totalBreak += breakMinutes;



                }



            });



            if (currentWeek !== "") {

                let totalRow = body.insertRow();

                totalRow.insertCell(0).colSpan = 9;
                totalRow.cells[0].style.border = 'none';
                totalRow.cells[0].style.textAlign = 'left';
                totalRow.cells[0].style.textShadow = '0 1px 2px rgba(0, 0, 0, 0.1)';
                totalRow.cells[0].style.fontWeight = 'bold';
                totalRow.cells[0].innerHTML =
                    "Weekly Total Hours: " + formatMinutes(weekTotal);
            }

            document.getElementById(
                "summary"
            ).innerHTML =

                `

<div style="margin-bottom:18px;">
    <div style="font-size:13px; color:#6b7280;">

    </div>
    <div style="font-size:22px; font-weight:bold;">
        ${count} days
    </div>
</div>


<div style="margin-bottom:18px;">
    <div style="font-size:13px; color:#6b7280;">

    </div>
    <div style="font-size:22px; font-weight:bold;">

    </div>
</div>

        // ===========================
        // GITHUB SAVE
        // ===========================

        async function saveToGitHub() {
            if (records.length === 0) {
                showGitHubStatus(
                    "⚠ No records to save",
                    "warning"
                );
                return;
            }

            try {

                showGitHubStatus(
                    "🔄 Saving to Database...",
                    "warning"
                );


                if (
                    GITHUB_TOKEN == "YOUR_TOKEN" ||
                    GITHUB_TOKEN == ""
                ) {

                    showGitHubStatus(
                        "⚠ Database token missing",
                        "error"
                    );

                    lastSaveFailed = true;

                    return;

                }



                const url =
                    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;



                let sha = "";

                let githubRecords = [...records];




                // Get SHA only (required to overwrite the file)

                let old = await fetch(url, {
                    headers: {
                        "Authorization": "Bearer " + GITHUB_TOKEN,
                        "Accept": "application/vnd.github+json"
                    }
                });

                if (old.ok) {
                    let oldFile = await old.json();
                    sha = oldFile.sha;
                }

                // Use only local records
                githubRecords = [...records];



                // ================================
                // CHECK DUPLICATE DATES
                // ================================

                let dateCount = {};


                githubRecords.forEach(r => {

                    let d = r.date;

                    dateCount[d] =
                        (dateCount[d] || 0) + 1;

                });



                let duplicateDates =
                    Object.keys(dateCount).filter(
                        d => dateCount[d] > 1
                    );



                if (duplicateDates.length > 0) {


                    showGitHubStatus(

                        "⚠ Duplicate dates found: " +
                        duplicateDates
                            .map(d => decrypt(d))
                            .join(", "),

                        "warning"

                    );


                }












                // ================================
                // SAVE DATA
                // ================================


                let encryptedData =
                    JSON.stringify(
                        githubRecords,
                        null,
                        2
                    );




                let encoded =
                    btoa(
                        unescape(
                            encodeURIComponent(
                                encryptedData
                            )
                        )
                    );





                let body = {


                    message:
                        "Update encrypted work data",


                    content:
                        encoded


                };





                if (sha != "") {

                    body.sha = sha;

                }





                let response =
                    await fetch(url, {


                        method:
                            "PUT",



                        headers: {


                            "Authorization":
                                "Bearer " + GITHUB_TOKEN,


                            "Accept":
                                "application/vnd.github+json",


                            "Content-Type":
                                "application/json"


                        },



                        body:
                            JSON.stringify(body)


                    });







                let result =
                    await response.json();






                if (response.ok) {


                    lastSaveFailed = false;



                    showGitHubStatus(

                        "✔ Saved successfully to Database",

                        "success"

                    );


                }

                else {


                    lastSaveFailed = true;



                    showGitHubStatus(

                        "❌ Database error: " +
                        result.message,

                        "error"

                    );



                    console.log(result);


                }




            }


            catch (error) {



                lastSaveFailed = true;



                showGitHubStatus(

                    "❌ Cannot connect to Database: " +
                    error.message,

                    "error"

                );


            }


        }

        function calculateSalary(totalHours) {

            // Convert minutes to hours
            let workedHours = totalHours / 60;


            let contractHours =
                Number(document.getElementById("contractHours").value);


            let salaryPerHour =
                Number(document.getElementById("salaryPerHour").value);


            let taxPercent =
                Number(document.getElementById("taxPercent").value);


            let extraPercent =
                Number(document.getElementById("extraPercent").value || 100);


            if (!Number.isFinite(contractHours) || !Number.isFinite(salaryPerHour) || !Number.isFinite(taxPercent) || contractHours <= 0 || salaryPerHour <= 0) {

                document.getElementById("salaryResult").innerHTML = `
        <div style="
            padding:12px;
            background:#fee2e2;
            color:#b91c1c;
            border-radius:8px;
            font-weight:bold;
        ">
        ⚠️ Please fill all required fields.
        </div>
    `;

                return;
            }



            let normalHours = Math.min(
                workedHours,
                contractHours
            );


            let extraHours = Math.max(
                workedHours - contractHours,
                0
            );


            let normalPay = normalHours * salaryPerHour;


            let extraPay =
                extraHours *
                salaryPerHour *
                ((extraPercent + 100) / 100);


            let grossSalary =
                normalPay + extraPay;

            let tax =
                grossSalary *
                (taxPercent / 100);


            let finalSalary =
                grossSalary - tax;



            document.getElementById("salaryResult").innerHTML = `
